# Local integration testing only. Set the three password/user variables in your shell.
services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_NAME:-pall_test_local}
      MARIADB_USER: ${DB_USER:?Set DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mariadb_test_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  mariadb_test_data:
